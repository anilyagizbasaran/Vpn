name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job per language rather than one big matrix: the three stacks fail for
# unrelated reasons, and a red build should say which one.
jobs:
  server:
    name: Control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  daemon:
    name: vpnd
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: vpnd/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      # The daemon ships for three platforms; a compile error on macOS should
      # not wait until release day to surface.
      - name: Cross-compile
        run: |
          for target in windows/amd64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

  client:
    name: Dart packages and apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: dart pub get
      - run: dart analyze packages apps

      # Pure Dart packages run under `dart test`; the Flutter ones need
      # `flutter test`. Splitting them keeps the failure message specific.
      - name: Test pure Dart packages
        run: |
          for package in vpn_crypto vpn_api vpn_tunnel_desktop; do
            (cd "packages/$package" && dart test) || exit 1
          done
      # The app's own tests render both screens at the real window size and
      # fail on an overflow. They matter more than usual: the Windows build
      # cannot run on the machine this is developed on, so this is the only
      # place a layout is ever actually laid out.
      - name: Test the app
        working-directory: apps/client
        run: flutter test

      # A failing run has to name the tests on the summary page. Without this
      # the only signal is "exit code 1", and reading which test broke means
      # downloading the log — which needs a token the repository owner may not
      # have to hand.
      - name: Test Flutter packages
        working-directory: packages/vpn_client
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            details=$(grep -E "\[E\]" -A 8 test.log | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Flutter tests failed::${details}"
            cat test.log
          fi
          exit "$status"

      # The standing proof that vpn_api stays web-safe: neither Flutter nor
      # dart:io survives dart2js, so this fails the moment one is added to a
      # layer that must not have them.
      - name: Check vpn_api still compiles for the web
        run: cd packages/vpn_api && dart compile js -o web_check.js example/web_check.dart

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build -t vpn-control-plane:ci ./server
          docker build -t vpn-node-agent:ci ./vpnd

      # Building is the cheap half. better-sqlite3 is a native module, and one
      # compiled against the wrong libc builds perfectly and then throws at
      # require() — so the image has to be started and its own health check
      # waited on before this job means anything.
      - name: The API image starts and reports healthy
        run: |
          docker run -d --name api \
            -e TOKEN_PEPPER="$(head -c 32 /dev/urandom | base64 -w0)" \
            -e JWT_REFRESH_PEPPER="$(head -c 32 /dev/urandom | base64 -w0)" \
            -e WG_SKIP_BOOTSTRAP_NODE=true \
            vpn-control-plane:ci
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' api)
            case "$state" in
              healthy)   echo "healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "--- the image never became healthy ---"
          docker logs api
          exit 1

      # The agent shells out to `wg`; without wireguard-tools in the image it
      # starts, syncs, and fails on every single peer.
      - name: The agent image carries wg
        run: docker run --rm --entrypoint wg vpn-node-agent:ci --version

  publish:
    name: Publish images
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # install.sh pulls these rather than building. The web image in
      # particular needs the whole Flutter workspace and a 2 GB toolchain to
      # build, which is not something to ask of the VPS someone just rented.
      - name: Build and push
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for image in "vpn-control-plane:./server:server/Dockerfile" \
                       "vpn-node-agent:./vpnd:vpnd/Dockerfile" \
                       "vpn-web:.:website/Dockerfile"; do
            name="${image%%:*}"; rest="${image#*:}"
            context="${rest%%:*}"; dockerfile="${rest#*:}"
            tag="ghcr.io/$owner/$name:latest"
            echo "::group::$tag"
            docker build -t "$tag" -f "$dockerfile" "$context"
            docker push "$tag"
            echo "::endgroup::"
          done

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the manifest
        run: |
          python3 -c "import json,sys; json.load(open('extension/manifest.json'))"
          python3 -c "import json,sys; json.load(open('extension/native-host/com.example.vpn_client.json'))"

      # Chrome refuses to load the whole extension when a single referenced
      # file is missing, and says so only in a dialog nobody sees in CI. The
      # icons were absent for the extension's entire life until someone tried
      # to install it.
      - name: Every file the manifest names exists
        run: |
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open('extension/manifest.json'))
          refs = [m['background']['service_worker'], m['action']['default_popup']]
          refs += list(m['icons'].values())
          refs += list(m['action']['default_icon'].values())
          missing = [r for r in sorted(set(refs)) if not os.path.exists(os.path.join('extension', r))]
          if missing:
              print('missing:', ', '.join(missing)); sys.exit(1)
          print('all', len(set(refs)), 'referenced files present')
          PY

      # A malformed rule file does not fail loudly: Chrome disables the whole
      # ruleset and the blocking silently stops working.
      - name: The blocking rules are well formed
        run: |
          python3 - <<'PY'
          import json, os, sys
          # Chrome validates rules against a strict schema and rejects the
          # whole ruleset over one unknown field — a "//" comment key in a rule
          # is enough to silently turn blocking off.
          RULE = {'id', 'priority', 'action', 'condition'}
          ACTION = {'type', 'redirect', 'requestHeaders', 'responseHeaders'}

          m = json.load(open('extension/manifest.json'))
          if any(k.startswith('//') for k in m):
              print('manifest.json has comment keys; Chrome reports them as unrecognized')
              sys.exit(1)

          total = 0
          for res in m['declarative_net_request']['rule_resources']:
              path = os.path.join('extension', res['path'])
              rules = json.load(open(path))
              ids = [r['id'] for r in rules]
              if len(ids) != len(set(ids)):
                  print(f'{path}: duplicate rule ids'); sys.exit(1)
              for r in rules:
                  extra = set(r) - RULE
                  if extra:
                      print(f"{path}: rule {r['id']} has fields the schema rejects: {extra}"); sys.exit(1)
                  if set(r['action']) - ACTION:
                      print(f"{path}: rule {r['id']} has an unknown action field"); sys.exit(1)
                  cond = r['condition']
                  # thirdParty is what keeps a site's own resources loading.
                  if cond.get('domainType') != 'thirdParty':
                      print(f"{path}: rule {r['id']} is not limited to third parties"); sys.exit(1)
                  for d in cond['requestDomains']:
                      if d.startswith('*') or '/' in d or d != d.lower():
                          print(f'{path}: bad domain {d}'); sys.exit(1)
                  total += len(cond['requestDomains'])
          print(f'{total} domains across {len(m["declarative_net_request"]["rule_resources"])} rulesets')
          PY

      - name: The scripts parse
        run: |
          for f in extension/background.js extension/popup.js; do
            node --input-type=module -e "$(cat "$f")" 2>&1 | grep -q SyntaxError && { echo "::error::$f has a syntax error"; exit 1; }
            echo "ok $f"
          done

      # The popup talks to the service worker by name. A message the worker has
      # no case for falls through the switch and answers nothing, which the
      # popup shows as a button that does not work — no error, nothing in a
      # console, and both files parse fine. That is exactly how the enrol
      # button shipped broken once.
      - name: Every message the popup sends has a handler
        run: |
          python3 - <<'PY'
          import re, sys
          popup = open('extension/popup.js').read()
          worker = open('extension/background.js').read()

          sent = set(re.findall(r"type:\s*'([a-z-]+)'", popup))
          handled = set(re.findall(r"case\s*'([a-z-]+)'", worker))

          missing = sorted(sent - handled)
          if missing:
              for name in missing:
                  print(f"::error::popup.js sends '{name}' but background.js has no case for it")
              sys.exit(1)
          print(f'{len(sent)} message types, all handled')
          PY
      - name: Refuse unreplaced placeholders in a release build
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -rq 'REPLACE_WITH' extension/native-host/; then
            echo "The native host manifest still contains placeholders."
            echo "It is generated per install, so this is expected on main — "
            echo "but the packaged extension must not ship with them."
          fi
