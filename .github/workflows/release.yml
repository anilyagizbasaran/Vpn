name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 1.2.0
        required: true

# Artifacts are unsigned. Signing is procurement, not code: Windows needs an
# OV or EV certificate, macOS needs an Apple Developer account plus
# notarisation. Until those exist, users see a SmartScreen warning on Windows
# and Gatekeeper refuses on macOS — which is exactly why the download page
# says so rather than pretending otherwise.
permissions:
  contents: write

jobs:
  daemon:
    name: vpnd (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: windows-amd64, goos: windows, goarch: amd64, ext: .exe }
          - { target: darwin-amd64,  goos: darwin,  goarch: amd64, ext: '' }
          - { target: darwin-arm64,  goos: darwin,  goarch: arm64, ext: '' }
          - { target: linux-amd64,   goos: linux,   goarch: amd64, ext: '' }
          - { target: linux-arm64,   goos: linux,   goarch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        working-directory: vpnd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Reproducible-ish: no cgo, so the binary does not pick up the
          # runner's libc and refuse to start on an older distribution.
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.version }}" ] && version="${{ inputs.version }}"
          mkdir -p dist
          for cmd in vpnd vpnctl vpn-browser-host; do
            go build -trimpath \
              -ldflags "-s -w -X vpnd/internal/ipc.Version=$version" \
              -o "dist/$cmd${{ matrix.ext }}" "./cmd/$cmd"
          done

      - name: Package
        working-directory: vpnd
        run: |
          cp deploy/vpnd.service deploy/install-windows.ps1 dist/ 2>/dev/null || true
          tar -czf "vpnd-${{ matrix.target }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: vpnd-${{ matrix.target }}
          path: vpnd/vpnd-${{ matrix.target }}.tar.gz

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub get
      # No --dart-define=API_BASE_URL. Everyone who runs this has their own
      # server, so a release with an address compiled in would ship pointing at
      # somebody else's; the app asks on first launch instead.
      - name: Build
        working-directory: apps/client
        shell: bash
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          status=$?
          set -e
          cat build.log
          if [ "$status" -ne 0 ]; then
            details=$(grep -iE "error|failed|exception" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::${details}"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk

  desktop:
    name: Desktop GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first platform to fail cancels the other two, and one
      # Linux problem reads as "Windows and macOS are broken as well".
      fail-fast: false
      matrix:
        # `target` names the artifact after what a user is downloading rather
        # than after the runner image: vpn-client-windows-x64.tar.gz, not
        # desktop-windows-latest.
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - run: dart pub get

      # The failure has to name itself on the summary page. Reading it out of
      # the log needs a token the repository owner may not have to hand, and a
      # release that breaks should still say what broke.
      - name: Build
        working-directory: apps/client
        shell: bash
        run: |
          set +e
          flutter build ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }} \
            --release > build.log 2>&1
          status=$?
          set -e
          cat build.log
          if [ "$status" -ne 0 ]; then
            details=$(grep -iE "error|failed|exception" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${{ matrix.target }} build failed::${details}"
          fi
          exit "$status"

      # Flutter puts each desktop target somewhere different, and only the
      # Windows one looks like `<platform>/x64/runner/Release`.
      #
      # Archiving here rather than uploading the directory: the publish job
      # attaches `artifacts/**/*` to the release, and a directory expands to
      # every loose DLL as its own release asset. The download page needs one
      # file per platform, not thirty.
      - name: Package
        shell: bash
        working-directory: apps/client
        run: |
          case "${{ runner.os }}" in
            Windows) src=build/windows/x64/runner/Release ;;
            macOS)   src=build/macos/Build/Products/Release ;;
            *)       src=build/linux/x64/release/bundle ;;
          esac
          if [ ! -d "$src" ]; then
            # The build reported success, so the output exists somewhere else.
            # Printing the tree turns "no build output" into an answer rather
            # than another round trip.
            listing=$(find build -maxdepth 4 -type d 2>/dev/null | head -40 |
                      awk '{printf "%s%%0A", $0}')
            echo "::error title=${{ matrix.target }}: no output at $src::${listing}"
            exit 1
          fi
          tar -czf "vpn-client-${{ matrix.target }}.tar.gz" -C "$src" .

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/client/vpn-client-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: [daemon, android, desktop]
    runs-on: ubuntu-latest
    # Drafts with whatever built. A platform that failed simply has no asset,
    # which is better than withholding the three that worked — the draft is
    # reviewed by a human before it is published anyway.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.daemon.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
          body: |
            ## Downloads

            These builds are **unsigned**. Windows will show a SmartScreen
            warning and macOS Gatekeeper will refuse to open the app until
            code signing certificates are in place.

            The desktop app needs the `vpnd` service installed — see the
            install script inside the `vpnd-*` archive for your platform.
