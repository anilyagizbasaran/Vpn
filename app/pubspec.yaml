name: vpn_client
description: "WireGuard VPN client for the self-hosted control plane."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for the control plane API.
  http: ^1.5.0

  # Keeps JWTs and WireGuard private keys in the Keychain / EncryptedSharedPreferences.
  flutter_secure_storage: ^9.2.4

  # Tunnel control. `wireguard_flutter` (0.1.3) has been unmaintained for ~2
  # years; this is the maintained fork with the same `WireGuardFlutter` API,
  # plus Android 16KB page-size support and traffic statistics.
  wireguard_flutter_plus: ^1.0.7

  # Minimal state management — no code generation, no build_runner.
  provider: ^6.1.5

  # X25519, so the WireGuard keypair is generated on the device and the
  # private half never reaches the server. Pure Dart, no platform channel.
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
