name: vpn_dashboard
description: "Account and device management in a browser."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.4

# Layer 4, like apps/client. Depends on vpn_api and nothing else from the
# stack: the browser cannot hold a tunnel or a device key, so vpn_client and
# vpn_tunnel have no place here. That vpn_api compiles for the web at all is
# the payoff for keeping Flutter and dart:io out of it.
dependencies:
  flutter:
    sdk: flutter
  vpn_api: ^0.1.0
  # Browser APIs. `package:web` rather than the deprecated dart:html.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
