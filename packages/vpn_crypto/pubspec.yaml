name: vpn_crypto
description: WireGuard key generation and key format rules. Pure Dart.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.4

# Deliberately no Flutter dependency: this layer has to be usable from the web
# dashboard, from tests, and from any future CLI without dragging in a UI
# toolkit. Adding `flutter` here would be an architecture regression.
dependencies:
  cryptography: ^2.9.0

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
