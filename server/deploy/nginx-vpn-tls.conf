# TLS front for the control plane, for a host that already runs nginx.
#
#   sudo cp nginx-vpn-tls.conf /etc/nginx/sites-available/vpn-tls
#   sudo ln -s /etc/nginx/sites-available/vpn-tls /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/acme -d YOUR.DOMAIN
#   sudo nginx -t && sudo systemctl reload nginx
#
# The installer uses Caddy in a container and needs none of this. This is for
# a machine where nginx already owns :443 — another site, a panel — and the
# VPN has to fit alongside it.
#
# Replace YOUR.DOMAIN throughout, and 3000 with the port the API is published
# on if it is not the compose default.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR.DOMAIN;

    # Kept outside the redirect so renewals do not depend on it.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR.DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No access log, and this is the point rather than an oversight.
    #
    # The control plane stores a key and an address per device and no history
    # at all — no names, no timestamps, no byte counters — so that there is
    # nothing to hand over and nothing to leak. An access log undoes that in
    # one line: an address, a time and a path for every /device/config call is
    # a record of who used this VPN and when, kept for however long logrotate
    # is set to.
    #
    # Failures still reach error_log, which records the fault and not the
    # request line. Only this server block is affected; other sites on the
    # machine keep logging as they were.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API runs with TRUST_PROXY=1, which counts exactly this one hop.
        # Add a hop here without changing that and every client shares one
        # rate-limit bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
